name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m robotlab demo
      - run: python -m pip install opencv-python-headless numpy Pillow
      - run: python -m unittest tests.test_camera_game tests.test_board_observer tests.test_webcam tests.test_smc_integration -v
      - run: python -m robotlab.smc_demo --config config/smc-offline.json --game
