[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotlab-demo"
version = "0.1.0"
description = "Simulation and integration starting point for the RobotLab remote board-game demo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robotlab-demo = "robotlab.__main__:main"

[tool.setuptools.packages.find]
include = ["robotlab*"]
